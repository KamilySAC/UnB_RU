 }","  validates :data, presence: true # presence = obrigatóriedade","","","  # funçao para leitura de catraca, avalia todas as regras de bloqueio antes de autorizar a passagem","  def self.ler_identificacao(identificacao:, turno:, data: Date.current, tarifa_customizada: nil)","    # busca o estudante pela matricula lido no sensor","    estudante = Estudante.find_by(matricula: identificacao.to_s)","","    # primeira regra: usuário não existe na base de dados, se não existe, bloqueia","    if estudante.nil?","      return create!(","        identificacao_lida: identificacao.to_s,","        turno: turno,","        data: data,","        status_catraca: \"bloqueada\",","        status_acesso: \"negado\",","        mensagem_visor: \"Usuário não encontrado\"","      )","    end","","    # segunda regra: bloqueio de dupla entrada no mesmo turno, verifica se o estudante ja completou uma refeição","    ja_usou = where(","      estudante_id: estudante.id,","      turno: turno,","      data: data,","      status_acesso: [ \"registrado\", \"isento\" ]","    ).exists?","","    if ja_usou","      return create!(","        estudante: estudante,","        identificacao_lida: estudante.matricula,","        turno: turno,","        data: data,","        status_catraca: \"bloqueada\",","        status_acesso: \"negado\",","        mensagem_visor: \"Refeição já utilizada neste turno\"","      )","    end","","    # calcula quanto custa a refeição para o referido discente","    tarifa = tarifa_customizada ? BigDecimal(tarifa_customizada.to_s) : estudante.tarifa_para(turno)","","","    # terceira regra: verificação de saldo para não isentos","    if !estudante.isento? && estudante.saldo \u003c tarifa","      return create!(","        estudante: estudante,","        identificacao_lida: estudante.matricula,","        turno: turno,","        data: data,","        status_catraca: \"bloqueada\",","        status_acesso: \"negado\",","        mensagem_visor: \"Saldo insuficiente\"","      )","    end","","    # quarta regra: caminho feliz - autorização provisória","    # destrava a catraca e aguarda o discente girar a catraca, o saldo aqui não é debitado, a catraca fica aguardando giro.","","","    create!(","      estudante: estudante,","      identificacao_lida: estudante.matricula,","      turno: turno,","      data: data,","      valor_debitado: tarifa,","      isento: estudante.isento?,","      status_catraca: \"liberada\",","      status_acesso: \"aguardando_giro\",","      mensagem_visor: \"Catraca liberada\"","    )","  end","","  # Função 2","  # método responsável por registrar o giro na catraca","  # a (!) indica que indica alteração de dados criticos - saldo","","  def registrar_giro!","    # só é permitido o giro se o acesso estiver com o status de catraca liberada e aguardando giro","    raise \"Catraca não está liberada\" unless status_catraca == \"liberada\" && status_acesso == \"aguardando_giro\"","","    # transaction garante que se der errado no meio do caminho ele volta o que fez","    transaction do","      if isento?","        # grupo I passa sem debitar, apenas atualiza o status do acesso","        update!(","          valor_debitado: 0.0,","          status_acesso: \"isento\",","          mensagem_visor: \"Acesso Liberado - Isento\"","        )","      else","        # Estudante pagantes: debita a tarifa do saldo e atualiza o status do acesso","        novo_saldo = (estudante.saldo - valor_debitado).round(2)","        estudante.update!(saldo: novo_saldo)","","        # marca acesso como concluído","        update!(","          status_acesso: \"registrado\",","          mensagem_visor: \"Refeição efetuada com sucesso\"","        )","      end","    end","  end","","  # timeout de seg sem giro","  def verificar_timeout!(segundos_decorridos)","    return false unless status_catraca == \"liberada\" && status_acesso == \"aguardando_giro\"","    return false if segundos_decorridos \u003c TIMEOUT_SEG","","    update!(","      valor_debitado: 0.0,","      status_catraca: \"bloqueada\",","      status_acesso: \"cancelado\",","      mensagem_visor: \"Tempo esgotado - Catraca bloqueada\"","    )","    true","  end","end"],"lines":[0,null,0,null,null,0,null,null,0,null,null,null,0,null,null,0,0,null,null,null,0,null,0,null,null,0,0,null,null,null,null,null,null,null,null,null,null,0,null,null,null,null,null,null,0,0,null,null,null,null,null,null,null,null,null,null,null,0,null,null,null,0,0,null,null,null,null,null,null,null,null,null,null,null,null,null,null,0,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,0,null,0,null,null,0,0,null,0,null,null,null,null,null,null,0,0,null,null,0,null,null,null,null,null,null,null,null,0,0,0,null,0,null,null,null,null,null,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":31,"omitted_lines":104,"total_lines":31},"app/models/application_record.rb":{"source":["class ApplicationRecord \u003c ActiveRecord::Base","  primary_abstract_class","end"],"lines":[0,0,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":2,"omitted_lines":1,"total_lines":2},"app/models/catraca.rb":{"source":["class Catraca \u003c ApplicationRecord","  belongs_to :restaurante","  has_many :acessos, dependent: :restrict_with_error","","  enum :status, { offline: 0, online: 1 }","","  validates :codigo, presence: true, uniqueness: { scope: :restaurante_id }","  validates :nome, presence: true","  validates :piso, numericality: { only_integer: true, greater_than: 0 }","  validate  :piso_existe_no_restaurante","","  private","","  def piso_existe_no_restaurante","    return if piso.blank? || restaurante.blank? || restaurante.total_pisos.blank?","    return if piso \u003c= restaurante.total_pisos","","    errors.add(:piso, \"deve estar dentro do total de pisos do restaurante\")","  end","end"],"lines":[0,0,0,null,0,null,0,0,0,0,null,0,null,0,0,0,null,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":13,"omitted_lines":7,"total_lines":13},"app/models/estudante.rb":{"source":["# frozen_string_literal: true","","# Represents a student (estudante) using the university restaurant system.","#","# A student belongs to a tariff group (Grupo I–IV) that determines the price","# paid per meal shift, and holds a balance (saldo) topped up via recharges.","#","# @example Fetching a student's lunch price","#   estudante.tarifa_para(\"Almoço\") #=> 0.0e0 for Grupo I","class Estudante \u003c ApplicationRecord","  # Tariff groups recognized by the system.","  GRUPOS = [\"Grupo I\", \"Grupo II\", \"Grupo III\", \"Grupo IV\"].freeze","","  # Per-shift prices (in BRL) for each tariff group.","  #","  # @return [Hash{String => Hash{String => Float}}]","  TARIFAS = {","    \"Grupo I\"   => { \"Café da manhã\" => 0.00, \"Almoço\" => 0.00, \"Jantar\" => 0.00 },","    \"Grupo II\"  => { \"Café da manhã\" => 2.00, \"Almoço\" => 4.50, \"Jantar\" => 4.50 },","    \"Grupo III\" => { \"Café da manhã\" => 7.05, \"Almoço\" => 15.20, \"Jantar\" => 15.20 },","    \"Grupo IV\"  => { \"Café da manhã\" => 1.50, \"Almoço\" => 2.50, \"Jantar\" => 2.50 }","  }.freeze","","  has_secure_password validations: false","","  has_many :acessos_catraca, class_name: \"AcessoCatraca\", dependent: :destroy","  has_many :recargas, dependent: :destroy","  has_many :refeicoes, class_name: \"Refeicao\", dependent: :destroy","","  validates :nome, presence: true","  validates :matricula, presence: true, uniqueness: true","  validates :grupo, inclusion: { in: GRUPOS }","  validates :saldo, numericality: { greater_than_or_equal_to: 0.00 }","","  # Returns true when the student is exempt from meal charges (Grupo I).","  #","  # @return [Boolean]","  def isento?","    grupo == \"Grupo I\"","  end","","  # Returns the meal price for the given shift, based on the student's group.","  #","  # @param turno [String] one of \"Café da manhã\", \"Almoço\", \"Jantar\"","  # @return [BigDecimal] price in BRL, or 0.0 when the shift is unknown", a sexta-feira sabado].freeze","","  # horário de funcionamento de cada turno (início inclusive, fim exclusive)","  TURNOS = {","    \"cafe_da_manha\" => { nome: \"Café da manhã\", inicio: \"07:00\", fim: \"09:00\" },","    \"almoco\" => { nome: \"Almoço\", inicio: \"11:00\", fim: \"14:30\" },","    \"jantar\" => { nome: \"Jantar\", inicio: \"17:30\", fim: \"19:30\" }","  }.freeze","","  # chave da opção no cardapio.json -> nome exibido","  OPCOES = {","    \"padrao\" => \"Padrão\",","    \"ovolactovegetariano\" => \"Ovolactovegetariano\",","    \"vegetariano_estrito\" => \"Vegetariano estrito\"","  }.freeze","","  ARQUIVO_PADRAO = Rails.root.join(\"cardapio.json\")","","  # uma opção de cardápio pronta para exibir; campos sem valor ficam nil","  Opcao = Struct.new(:nome, :prato_principal, :guarnicao, :salada, :sobremesa, :bebida, keyword_init: true)","","  class \u003c\u003c self","    # permite trocar o arquivo (usado nos testes)","    attr_writer :arquivo","","    def arquivo","      @arquivo || ARQUIVO_PADRAO","    end","  end","","  attr_reader :agora","","  def initialize(agora: Time.current)","    @agora = agora.in_time_zone(FUSO)","  end","","  # true quando existe cardápio para o dia e o turno em andamento","  def disponivel?","    dados_do_turno.present?","  end","","  def turno_nome","    TURNOS.dig(turno_atual, :nome)","  end","","  # ex.: \"11:00 às 14:30\"","  def horario","    turno = TURNOS[turno_atual]","    \"#{turno[:inicio]} às #{turno[:fim]}\" if turno","  end","","  def restaurante_nome","    Restaurante.order(:nome).first&.nome || NOME_RESTAURANTE_PADRAO","  end","","  def opcoes","    return [] unless disponivel?","","    OPCOES.map { |chave, nome| montar_opcao(chave, nome) }","  end","","  # arroz, feijão etc.: comum às três opções (não existe no café da manhã)","  def acompanhamentos","    Array(dados_do_turno && dados_do_turno[\"acompanhamentos\"]).join(\" e \").presence","  end","","  private","","  # chave do turno em andamento no horário de Brasília (nil fora do funcionamento)","  def turno_atual","    minutos = (agora.hour * 60) + agora.min","    TURNOS.find { |_, turno| minutos >= minutos_de(turno[:inicio]) && minutos \u003c minutos_de(turno[:fim]) }&.first","  end","","  def minutos_de(hora)","    horas, minutos = hora.split(\":\").map(&:to_i)","    (horas * 60) + minutos","  end","","  def dados_do_turno","    return @dados_do_turno if defined?(@dados_do_turno)","","    dados = turno_atual && cardapio_completo.dig(DIAS[agora.wday], turno_atual)","    @dados_do_turno = dados.is_a?(Hash) ? dados : nil","  end","","  # arquivo ausente ou inválido equivale a \"sem cardápio cadastrado\"","  def cardapio_completo","    conteudo = JSON.parse(File.read(self.class.arquivo))","    conteudo.is_a?(Hash) ? conteudo : {}","  rescue Errno::ENOENT, JSON::ParserError","    {}","  end","","  def montar_opcao(chave, nome)","    if turno_atual == \"cafe_da_manha\"","      opcao_do_cafe(chave, nome)","    else","      opcao_de_refeicao(chave, nome)","    end","  end","","  def opcao_de_refeicao(chave, nome)","    dados = dados_do_turno","    Opcao.new(","      nome: nome,","      prato_principal: dados[\"prato_principal_#{chave}\"],","      guarnicao: dados[\"guarnicao\"] || juntar([ dados[\"sopa\"], dados[\"torrada\"] ]),","      salada: juntar([ dados[\"salada_1\"], dados[\"salada_2\"] ]),","      sobremesa: dados[\"sobremesa\"],","      bebida: dados[\"bebida\"]","    )","  end","","  # o café não tem prato principal nem salada: o complemento do pão faz o papel de prato principal","  def opcao_do_cafe(chave, nome)","    dados = dados_do_turno","    paes = juntar(Array(dados[\"panificacao\"]), \", \")","    guarnicao = [ paes, dados[\"gordura\"] ].compact_blank.join(\" com \")","","    Opcao.new(","      nome: nome,","      prato_principal: dados[\"complemento_#{chave}\"],","      guarnicao: juntar([ guarnicao, dados[\"opcao_extra\"] ]),","      salada: nil,","      sobremesa: dados[\"fruta\"],","      bebida: juntar(Array(dados[\"bebidas\"]))","    )","  end","","  def juntar(itens, separador = \" e \")","    itens.compact_blank.join(separador).presence","  end","end"],"lines":[null,null,null,0,0,null,0,0,null,null,0,null,null,null,0,null,null,null,null,null,null,0,null,null,null,null,0,null,null,0,null,0,null,0,null,0,0,null,null,null,0,null,0,0,null,null,null,0,0,null,null,0,0,null,null,null,0,0,0,null,null,0,0,null,null,0,0,null,0,null,null,null,0,0,null,null,0,null,null,0,0,0,null,null,0,0,0,null,null,0,0,null,0,0,null,null,null,0,0,0,null,0,null,null,0,0,0,null,0,null,null,null,0,0,0,null,null,null,null,null,null,null,null,null,null,0,0,0,0,null,0,null,null,null,null,null,null,null,null,null,0,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":59,"omitted_lines":85,"total_lines":59},"app/services/gerador_historico_pdf.rb":{"source":["# a gem prawn, responsável por desenhar e renderizar pdf em ruby","require \"prawn\"","Prawn::Fonts::AFM.hide_m17n_warning = true","","","class GeradorHistoricoPdf","  NOME_ARQUIVO = \"historico_estudante.pdf\".freeze","","  # cria getters, os dados do relatório fora da classe","  attr_reader :estudante, :data_referencia, :inicio_mes, :fim_mes, :recargas, :refeicoes","","  def initialize(estudante, data_referencia: Date.current) # constructor","    @estudante = estudante","    @data_referencia = data_referencia","","    @inicio_mes = data_referencia.beginning_of_month # retorna o primeiro dia do mes","    @fim_mes = data_referencia.end_of_month # retorna o ultimo dia do mes","","    # filtra as movimentações no intervalo do mes atual, qualquer recarga feita anteriormente é desconsiderada da consulta do banco","    @recargas = estudante.recargas.where(data: @inicio_mes..@fim_mes).order(:data)","    @refeicoes = estudante.refeicoes.where(data: @inicio_mes..@fim_mes).order(:data)","  end","","  # função de possui movimentações, retorna true se houver recargas ou refeições no mes atual","  def possui_movimentacoes?"," ove_down 20","","","    # 4. Detalhamento das recargas do mês atual","    pdf.text \"Extrato de Recargas do Mês\", size: 12, style: :bold","    pdf.stroke_horizontal_rule","    pdf.move_down 5","    if recargas.any?","      recargas.each do |recarga|","        pdf.text \"#{recarga.data.strftime('%d/%m/%Y')} - #{recarga.forma} - R$ #{format('%.2f', recarga.valor).tr('.', ',')} (#{recarga.status})\"","      end","    else","      pdf.text \"Nenhuma recarga realizada neste mês.\", style: :italic, color: \"777777\"","    end","    pdf.move_down 15","","","  # 5. Detalhamento das refeições do mês atual","  pdf.text \"Histórico de Refeições do Mês\", size: 12, style: :bold","    pdf.stroke_horizontal_rule","    pdf.move_down 5","    if refeicoes.any?","      refeicoes.each do |refeicao|","        pdf.text \"#{refeicao.data.strftime('%d/%m/%Y')} - #{refeicao.restaurante} - R$ #{format('%.2f', refeicao.valor).tr('.', ',')}\"","      end","    else","      pdf.text \"Nenhuma refeição consumida neste mês.\", style: :italic, color: \"777777\"","    end","    # .render converte o documento desenhado em binário de arquivo PDF","    pdf.render","  end","end"],"lines":[null,0,0,null,null,0,0,null,null,0,null,0,0,0,null,0,0,null,null,0,0,null,null,null,0,0,null,null,null,null,0,0,null,null,null,null,0,0,null,null,null,0,null,0,null,null,0,null,null,0,null,0,null,0,null,0,null,null,null,0,0,0,0,0,0,null,0,0,null,null,null,0,0,0,0,0,0,null,null,null,0,0,0,0,0,0,null,null,0,null,0,null,null,null,0,0,0,0,0,0,null,null,0,null,null,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":55,"omitted_lines":53,"total_lines":55},"app/services/historico_global.rb":{"source":["# consulta do histórico global de acessos do campus (visão do administrador)","# aplica os filtros (restaurante e catraca) e calcula totais e agrupamentos","class HistoricoGlobal","  # motivo que conta como acesso fora do horário (usado na pontualidade)","  MOTIVO_JANELA_EXPIRADA = \"Janela Expirada\".freeze","","  AGRUPAMENTOS = %w[restaurante catraca].freeze","","  # uma linha das tabelas agrupadas","  #   acessos: todas as tentativas; passagens: só as liberadas","  #   arrecadacao: soma da tarifa das passagens liberadas","  #   pontualidade: % de acessos que NÃO foram bloqueados por janela expirada (nil se não há acessos)","  Linha = Struct.new(:nome, :acessos, :passagens, :arrecadacao, :pontualidade, keyword_init: true)","","  attr_reader :restaurante, :catraca, :agrupar","","  def initialize(restaurante: nil, catraca: nil, agrupar: nil)","    @restaurante = restaurante","    # catraca de outro restaurante não vale como filtro (não aparece nas opções)","    @catraca = catraca if catraca.nil? || restaurante.nil? || catraca.restaurante_id == restaurante.id","    @agrupar = agrupar.to_s if AGRUPAMENTOS.include?(agrupar.to_s)","  end","","  # acessos da listagem, do mais recente para o mais antigo","  def acessos","    escopo.includes(catraca: :restaurante).order(ocorrido_em: :desc)","  end","","  def total_acessos","    totais.acessos","  end","","  def arrecadacao_bruta","    totais.arrecadacao","  end","","  def sem_acessos?","    total_acessos.zero?","  end","","  # totais do campus considerando os filtros aplicados","  def totais","    @totais ||= linha_de(\"Total consolidado\", *escopo.pick(*EXPRESSOES.values))","  end","","  def restaurantes_disponiveis","    Restaurante.order(:nome)","  end","","  # com restaurante selecionado, só as catracas dele ficam como opção","  def catracas_disponiveis","    base = restaurante ? restaurante.catracas : Catraca.all","    base.includes(:restaurante).order(:nome)","  end","","  def linhas_por_restaurante","    dados = agregar(\"catracas.restaurante_id\")","    restaurantes_no_escopo.map do |r|","      linha_de(r.nome, *dados.fetch(r.id, []))","    end","  end","","  def linhas_por_catraca","    dados = agregar(\"acessos.catraca_id\")","    catracas_no_escopo.map do |c|","      linha_de(\"#{c.restaurante.nome} - #{c.nome}\", *dados.fetch(c.id, []))","    end","  end","","  private","","  LIBERADO = Acesso.status_acessos.fetch(\"liberado\")","","  # expressões SQL fixas (sem dado do usuário): total, passagens, arrecadação e acessos fora da janela","  EXPRESSOES = {","    acessos: \"COUNT(*)\",","    passagens: \"SUM(CASE WHEN acessos.status_acesso = #{LIBERADO} THEN 1 ELSE 0 END)\",","    arrecadacao: \"SUM(CASE WHEN acessos.status_acesso = #{LIBERADO} THEN acessos.tarifa ELSE 0 END)\",","    janela_expirada: \"SUM(CASE WHEN LOWER(acessos.motivo_negativa) = '#{MOTIVO_JANELA_EXPIRADA.downcase}' THEN 1 ELSE 0 END)\"","  }.transform_values { |sql| Arel.sql(sql) }.freeze","","  def escopo","    relacao = Acesso.joins(:catraca)","    relacao = relacao.where(catracas: { restaurante_id: restaurante.id }) if restaurante","    relacao = relacao.where(catraca_id: catraca.id) if catraca","    relacao","  end","","  # { id do grupo => [acessos, passagens, arrecadação, janela expirada] }","  def agregar(coluna)","    escopo.group(Arel.sql(coluna)).pluck(Arel.sql(coluna), *EXPRESSOES.values).to_h do |id, *valores|","      [ id, valores ]","    end","  end","","  def restaurantes_no_escopo","    return [ catraca.restaurante ] if catraca","    return [ restaurante ] if restaurante","","    Restaurante.order(:nome)","  end","","  def catracas_no_escopo","    return [ catraca ] if catraca","","    catracas_disponiveis","  end","","  def linha_de(nome, acessos = 0, passagens = 0, arrecadacao = 0, janela_expirada = 0)","    acessos = acessos.to_i","    Linha.new(","      nome: nome,","      acessos: acessos,","      passagens: passagens.to_i,","      arrecadacao: (arrecadacao || 0).to_d.round(2),","      pontualidade: acessos.zero? ? nil : (((acessos - janela_expirada.to_i) * 100.0) / acessos).round(1)","    )","  end","end"],"lines":[null,null,0,null,0,null,0,null,null,null,null,null,0,null,0,null,0,0,null,0,0,null,null,null,0,0,null,null,0,0,null,null,0,0,null,null,0,0,null,null,null,0,0,null,null,0
