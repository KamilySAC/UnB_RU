name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version # ou fixe, ex: "3.3"
          bundler-cache: true # instala gems e faz cache

      - name: Rodar RuboCop
        run: bundle exec rubocop --parallel

  tests:
    name: RSpec + Cucumber
    runs-on: ubuntu-latest

    # Remova este bloco se não usar banco de dados
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Preparar banco de dados
        run: bin/rails db:create db:schema:load

      - name: Rodar RSpec
        run: bundle exec rspec

      - name: Rodar Cucumber
        run: bundle exec cucumber --format progress
